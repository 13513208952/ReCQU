name: Bug 报告
description: 报告可复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先删除账号、Cookie、Token、验证码、真实成绩、真实课表和未脱敏请求内容。安全问题请使用仓库 Security 页的私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: ReCQU 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Pixel 8 / Android 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 不要粘贴任何登录信息或完整网络响应。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本报告不包含凭据、会话、验证码或真实个人数据
          required: true
